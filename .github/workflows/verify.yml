name: Verify Kozel
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kozel_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kozel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kozel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KOZEL_TEST_DATABASE_URL: postgresql://kozel_test:local_test_only@127.0.0.1:5432/kozel_test
      KOZEL_TEST_SERVER_URL: http://127.0.0.1:3005
      DATABASE_URL: postgresql://kozel_test:local_test_only@127.0.0.1:5432/kozel_test
      NODE_ENV: test
      DB_TLS: disable
      JWT_SECRET: ci-test-only-not-a-production-secret-123456789
      PORT: 3005
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:deploy
      - run: pnpm test:db
      - name: Test HTTP and socket server
        run: |
          pnpm --filter @kozel/server start > /tmp/kozel-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; cat /tmp/kozel-server.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3005/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3005/health
          pnpm test:integration
